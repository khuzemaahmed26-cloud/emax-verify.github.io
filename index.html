<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document Verification</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 320px;
      text-align: center;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
    }
    button {
      padding: 10px 15px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
    }
    .result {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="box">
<div>
<img src="e-max.png" alt="emax logo" height="100px" width="250px">
</div>

  <h2>Document Verification</h2>
  <p>Enter Password to Verify Document</p>

  <input type="password" id="pass" placeholder="Enter Password">
  <button onclick="checkPassword()">Verify</button>

  <div class="result" id="result"></div>
</div>

<script>
  // 🔐 Set your password here
  const correctPassword = "12345ABC";

  function checkPassword() {
    const input = document.getElementById("pass").value;
    const result = document.getElementById("result");

    if (input === correctPassword) {
      result.style.color = "green";
      result.innerText = "✅ Document Verified Successfully";
    } else {
      result.style.color = "red";
      result.innerText = "❌ Invalid Password";
    }
  }
</script>

</body>
</html>
